services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tide}
      POSTGRES_DB: ${POSTGRES_DB:-tide}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - tide_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tide} -d ${POSTGRES_DB:-tide}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tide_pg:
